[package]
autobins = false
name = "music-studio-native"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
transcript-store.workspace = true
eframe = { version = "0.33.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-all"] }

[[bin]]
name = "MusicStudio-Rust"
path = "src/main.rs"
