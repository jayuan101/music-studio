name: Build (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the artifact (e.g. 1.0.0)"
        required: false
        default: "dev"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ffmpeg and Qt runtime libraries
        run: |
          sudo apt-get update -qq
          # ffmpeg is what the tests actually exercise. The Qt libraries are
          # needed because importing PySide6 on a bare runner fails with
          # "libEGL.so.1: cannot open shared object file" -- and the failure
          # happens at import, before any test runs.
          sudo apt-get install -y -qq \
            ffmpeg \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libxrender1 libpulse0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check the app imports
        # A packaging or import error should fail here with a clear message,
        # not halfway through a 15-minute Windows build.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import musicstudio.app; print('app imports')"
          python -c "from musicstudio.ui.main_window import MainWindow; print('ui imports')"
          python -c "from PySide6.QtMultimedia import QMediaPlayer; print('playback imports')"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a python -m pytest tests -q

  build:
    name: Build Windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Fetch ffmpeg for bundling
        shell: pwsh
        run: |
          # gyan.dev publishes the standard Windows builds. "full" rather than
          # "essentials" because it carries librubberband, which the editor
          # uses for pitch shifting that preserves tempo.
          #
          # Note: these builds do NOT include libfdk_aac -- its licence is not
          # compatible with redistributing a GPL binary. core/convert.py
          # detects that and falls back to ffmpeg's native AAC encoder.
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.7z -UseBasicParsing
          7z x ffmpeg.7z -offmpeg-extracted | Out-Null

          New-Item -ItemType Directory -Force -Path vendor/ffmpeg | Out-Null
          Get-ChildItem -Path ffmpeg-extracted -Recurse -Include ffmpeg.exe,ffprobe.exe |
            ForEach-Object { Copy-Item $_.FullName -Destination vendor/ffmpeg -Force }

          if (-not (Test-Path vendor/ffmpeg/ffmpeg.exe)) {
            throw "ffmpeg.exe was not found after extraction"
          }
          ./vendor/ffmpeg/ffmpeg.exe -version | Select-Object -First 1

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean MusicStudio.spec

      - name: Verify the bundle
        shell: pwsh
        run: |
          # Catch the classic packaging failures here rather than in a bug
          # report: a missing executable, or ffmpeg not shipped alongside it.
          if (-not (Test-Path dist/MusicStudio/MusicStudio.exe)) {
            throw "MusicStudio.exe was not produced"
          }
          if (-not (Test-Path dist/MusicStudio/_internal/ffmpeg/ffmpeg.exe)) {
            if (-not (Test-Path dist/MusicStudio/ffmpeg/ffmpeg.exe)) {
              throw "ffmpeg was not bundled into the distribution"
            }
          }
          # QtMultimedia is what plays audio. It lives in PySide6-Addons and
          # is easy to lose to an over-broad exclude, which would ship a
          # silent app that otherwise looks fine.
          if (-not (Get-ChildItem dist/MusicStudio -Recurse -Filter "*QtMultimedia*")) {
            throw "QtMultimedia was not bundled -- playback would not work"
          }
          if (-not (Test-Path dist/MusicStudio/_internal/assets/icon.ico)) {
            Write-Warning "Application icon was not bundled"
          }
          # The auto-trim speech-detection model. Missing it does not crash
          # the app (core/speech.py degrades to "unavailable"), but it would
          # silently ship the "experimental" Preferences checkbox as a dead
          # no-op, so it is worth catching here rather than in a bug report.
          if (-not (Get-ChildItem dist/MusicStudio -Recurse -Filter "silero_vad.onnx")) {
            Write-Warning "silero_vad.onnx was not bundled -- spoken-intro auto-trim would silently do nothing"
          }
          if (-not (Get-ChildItem dist/MusicStudio -Recurse -Filter "onnxruntime*")) {
            Write-Warning "onnxruntime does not appear to be bundled -- spoken-intro auto-trim would silently do nothing"
          }
          $size = (Get-ChildItem dist/MusicStudio -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("Bundle size: {0:N1} MB" -f $size)

      - name: Verify Personal AI dependencies import when frozen
        # anthropic and keyring.backends.Windows are PyInstaller hiddenimports
        # (see MusicStudio.spec) precisely because static analysis can't find
        # them on its own -- that makes them the most likely thing to quietly
        # stop resolving in a future PyInstaller/dependency bump. Building
        # scripts/verify_frozen_ai_imports.py into its own tiny executable and
        # running it here proves the import actually works once frozen,
        # rather than just trusting the hiddenimports list.
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --paths . `
            --hidden-import anthropic --hidden-import keyring.backends.Windows `
            --distpath dist-ai-check --workpath build-ai-check --specpath build-ai-check `
            scripts/verify_frozen_ai_imports.py

          $output = & dist-ai-check/verify_frozen_ai_imports.exe | Out-String
          Write-Host $output
          if ($output -notmatch "FROZEN_AI_IMPORTS_OK") {
            throw "Personal AI dependencies (anthropic/keyring) did not import correctly from a frozen bundle"
          }

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $raw = "${{ github.ref_name }}"
          if ($raw -like "v*") { $version = $raw -replace '^v', '' }
          else { $version = "${{ github.event.inputs.version }}" }
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "dev" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version"

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/MusicStudio/* `
            -DestinationPath "MusicStudio-Windows-${{ steps.version.outputs.version }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MusicStudio-Windows-${{ steps.version.outputs.version }}
          path: MusicStudio-Windows-*.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "MusicStudio-Windows-${{ steps.version.outputs.version }}.zip" `
            --title "Music Studio ${{ steps.version.outputs.version }}" `
            --notes "Windows build of Music Studio. Unzip anywhere and run MusicStudio.exe — ffmpeg is bundled, nothing else to install." `
            --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release upload "${{ github.ref_name }}" `
              "MusicStudio-Windows-${{ steps.version.outputs.version }}.zip" `
              --clobber --repo "${{ github.repository }}"
          }
